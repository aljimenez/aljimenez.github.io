<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Rivals - Mantis Soundboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Basic body styling */
        body {
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a2a22; /* Darker, earthy green */
            color: #e8f5e9; /* Light green text, like new leaves */
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scrolling on the body */
        }

        /* Main heading style */
        h1 {
            font-family: 'Orbitron', sans-serif; /* A more futuristic/game-like font */
            color: #a5d6a7; /* Lighter green, like Mantis's skin highlights */
            margin-bottom: 10px;
            font-size: 2.8em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }

        .character-info {
            font-family: 'Roboto', sans-serif;
            color: #c8e6c9; /* Soft green */
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .character-info strong {
            color: #fff59d; /* Pale yellow, like her antennae tips */
        }

        /* Styling for the grid container */
        .soundboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%; /* Ensure grid takes full width */
            max-width: 1000px;
            margin: 20px auto;
            padding: 25px; /* Keep some padding, adjust in media query if needed */
            background-color: #2e473b; /* Medium dark green, like foliage */
            border-radius: 16px; /* Slightly more rounded */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35); /* Deeper shadow */
            border: 1px solid #4caf50; /* Green border */
            box-sizing: border-box; /* Include padding in the element's total width */
        }

        /* Styling for each sound button */
        .sound-button {
            padding: 15px 10px; /* Adjusted padding for better text wrapping */
            font-size: 0.95em;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
            color: #1b2720; /* Dark text for contrast on light buttons */
            background-image: linear-gradient(to bottom, #fff59d, #fbc02d); /* Yellow gradient - Mantis's antennae/accents */
            border: none;
            border-radius: 10px; /* More rounded */
            cursor: pointer;
            transition: background-image 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 5px 8px rgba(0,0,0,0.25);
            /* Removed overflow, text-overflow, white-space to allow wrapping */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center; /* Center text within the button */
            min-height: 60px; /* Increased min-height to accommodate two lines */
            word-break: break-word; /* Break long words */
            line-height: 1.3; /* Slightly increased line height */
        }

        .sound-button:hover {
            background-image: linear-gradient(to bottom, #fce680, #f9a825); /* Slightly darker yellow */
            box-shadow: 0 7px 14px rgba(0,0,0,0.3);
        }

        .sound-button:active {
            background-image: linear-gradient(to bottom, #f9a825, #f57f17); /* Even darker yellow/orange */
            transform: scale(0.96);
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        /* Accessibility: focus style */
        .sound-button:focus {
            outline: 3px solid #81c784; /* Bright green focus outline */
            outline-offset: 3px;
        }

        /* Container for audio elements, hidden from view */
        .audio-controls {
            display: none;
        }

        /* Footer styling */
        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.9em;
            color: #a5d6a7; /* Light green for footer text */
        }
        footer p {
            font-family: 'Roboto', sans-serif;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            body {
                padding: 10px; /* Reduce body padding on small screens */
            }
            h1 {
                font-size: 2.2em;
            }
            .character-info {
                font-size: 1em;
            }
            .soundboard-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); /* Smaller min button width */
                gap: 10px; /* Reduce gap */
                padding: 15px; /* Reduce grid padding */
            }
            .sound-button {
                font-size: 0.85em; /* Further adjust for smaller buttons */
                padding: 12px 8px; /* Adjusted padding */
                min-height: 55px; /* Adjusted min-height */
            }
        }

        /* Style for the temporary message div */
        .temp-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f44336; /* Default error color */
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .temp-message.warning {
            background-color: #ff9800; /* Warning color */
        }

    </style>
</head>
<body>

    <h1>MARVEL RIVALS</h1>
    <div class="character-info">Soundboard Edition: <strong>MANTIS</strong></div>

    <div id="soundboardGrid" class="soundboard-grid">
        <p id="loadingMessage" style="color: #e8f5e9;">Loading Mantis's Empathic Sounds...</p>
    </div>

    <div id="audioElementsContainer" class="audio-controls">
        </div>

    <footer>
        <p>&copy; 2025 Marvel Rivals - Mantis Fan Soundboard. Feel the vibes!</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- CONFIGURATION ---
            // List of Mantis sound filenames (without the .mov extension)
            // These files are assumed to be in a directory named "mantis"
            const soundFileNames = [
                "Feeling bad",
                "I feel bad for you",
                "Did I hurt your feelings",
                "Something unatural in you",
                "Step it up",
                "Chin up",
                "Wait what",
                "That's not polite",
                "You've made me angry",
                "My anger is healthy",
                "This is natural anger",
                "I sense sarcasm",
                "That's a lie",
                "Why do you lie",
                "Take your lies elsewhere",
                "Sometimes you can reason with people",
                "We fight for world not glory",
                "I feel vulnerable",
                "Help please",
                "Don't hold in your emotions",
                "Such an emotional time",
                "I feel your pain",
                "Are you anxious",
                "Take a nap",
                "I think not",
                "Yes",
                "Ok understood",
                "I am less angry now",
                "Can I help",
                "I will take risks",
                "Mantis ready to strike",
                "It pleases me to be helpful",
                "We're on our way to victory",
                "Oh hi",
                "Friends gather around",
                "Glad to help",
                "Ah thank you",
                "You're so kind",
                // Add more base filenames as needed
            ];
            const audioDirectory = "mantis/"; // Directory where sound files are located
            const audioExtension = ".mov"; // The file extension for the sound files
            // --- END CONFIGURATION ---

            const soundboardGridElement = document.getElementById('soundboardGrid');
            const audioElementsContainerElement = document.getElementById('audioElementsContainer');
            const loadingMessageElement = document.getElementById('loadingMessage');

            if (!soundboardGridElement || !audioElementsContainerElement || !loadingMessageElement) {
                console.error("Initialization failed: Essential HTML elements are missing.");
                if(loadingMessageElement) loadingMessageElement.textContent = "Error: Could not initialize Mantis soundboard.";
                return;
            }

            loadingMessageElement.style.display = 'none';

            if (soundFileNames.length === 0) {
                const noSoundsMessage = document.createElement('p');
                noSoundsMessage.textContent = "No sound files configured. Please add Mantis-themed sound filenames to the 'soundFileNames' array in the script.";
                noSoundsMessage.style.color = "#e8f5e9"; // Match body text color
                soundboardGridElement.appendChild(noSoundsMessage);
                return;
            }

            const audioPlayers = {};

            // Function to show temporary messages
            function showMessage(message, type = 'error') {
                const messageDiv = document.createElement('div');
                messageDiv.textContent = message;
                messageDiv.className = 'temp-message';
                if (type === 'warning') {
                    messageDiv.classList.add('warning');
                }
                document.body.appendChild(messageDiv);
                setTimeout(() => {
                    messageDiv.style.opacity = '0';
                    messageDiv.addEventListener('transitionend', () => messageDiv.remove());
                }, 4500); // Fade out after 4.5 seconds, remove after 5 seconds
            }


            soundFileNames.forEach(baseFilename => {
                const button = document.createElement('button');
                button.className = 'sound-button';

                // Use the base filename for the button text
                let buttonText = baseFilename.replace(/[-_]/g, ' ');
                buttonText = buttonText.replace(/\b\w/g, char => char.toUpperCase());

                button.textContent = buttonText;
                button.title = `Play: ${buttonText}`;

                // Construct the full file path
                const fullFilePath = audioDirectory + baseFilename + audioExtension;

                const audio = document.createElement('audio');
                // Create a unique ID based on the full file path
                const audioId = `audio-${fullFilePath.replace(/[^a-zA-Z0-9]/g, '-')}`;
                audio.id = audioId;
                audio.src = fullFilePath; // Set the source to the full file path
                audio.preload = 'auto';

                // Store the audio player using the full file path as the key
                audioPlayers[fullFilePath] = audio;
                audioElementsContainerElement.appendChild(audio);

                button.addEventListener('click', () => {
                    // Retrieve the sound player using the full file path
                    const soundToPlay = audioPlayers[fullFilePath];
                    if (soundToPlay) {
                        if (!soundToPlay.paused) {
                            // If the sound is already playing, stop it
                            soundToPlay.pause();
                            soundToPlay.currentTime = 0;
                        } else {
                            // If the sound is not playing, stop any others and play this one
                            Object.values(audioPlayers).forEach(player => {
                                if (player !== soundToPlay && !player.paused) {
                                    player.pause();
                                    player.currentTime = 0;
                                }
                            });
                            soundToPlay.currentTime = 0;
                            soundToPlay.play().catch(error => {
                                console.error(`Error playing sound "${fullFilePath}":`, error);
                                showMessage(`Mantis cannot channel this sound: ${buttonText}. Check console.`, 'error');
                            });
                        }
                    } else {
                        console.error(`Audio element for "${fullFilePath}" not found.`);
                        showMessage(`The empathic link to "${buttonText}" is broken. Check configuration.`, 'warning');
                    }
                });
                soundboardGridElement.appendChild(button);
            });
        });
    </script>

</body>
</html>
